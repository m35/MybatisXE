plugins {
    id 'java'
}

group 'com.baomidou.sample.mybatis-plus3'
version '1.1.0'

repositories {
    mavenLocal()
    //maven { url 'http://maven.aliyun.com/nexus/content/groups/public/'        allowInsecureProtocol = true }
    //maven { url 'http://maven.aliyun.com/nexus/content/repositories/jcenter'        allowInsecureProtocol = true}
    mavenCentral()
}


dependencies {
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter', version: '2.3.2.RELEASE'
    implementation group: 'com.baomidou', name: 'mybatis-plus-boot-starter', version: '3.3.0'
    // https://mvnrepository.com/artifact/javax.persistence/javax.persistence-api
    implementation group: 'javax.persistence', name: 'javax.persistence-api', version: '2.2'
    testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: '2.3.2.RELEASE'
    testImplementation group: 'junit', name: 'junit', version: '4.10'
    testImplementation group: 'com.h2database', name: 'h2', version: '1.4.200'
    // https://mvnrepository.com/artifact/org.projectlombok/lombok
    implementation group: 'org.projectlombok', name: 'lombok', version: '1.18.8'

}



tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

test{
    useJUnitPlatform()
}
